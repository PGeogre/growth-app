name: english_coach
description: "个人成长提升 App：英语学习 / 饮食 / 睡眠 / 运动 / 成长中心，离线优先、数据本地存储"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 本地存储
  sqflite: ^2.4.1
  path: ^1.9.0
  # 状态管理
  flutter_riverpod: ^2.6.1
  # 图表
  fl_chart: ^0.69.0
  # 日期工具
  intl: ^0.19.0
  # 图片选择 + 本地路径
  image_picker: ^1.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/words.json
